name: ELITE EMPIRE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip build-essential \
          libffi-dev libssl-dev zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          libtinfo6 cmake autoconf automake libtool pkg-config libltdl-dev \
          libc6-dev libstdc++6

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        export PIP_DEFAULT_TIMEOUT=100
        pip install buildozer cython==0.29.36

    - name: Extract Project
      run: |
        unzip ELITE_EMPIRE_SAFE_PROJECT.zip -d project

    - name: Build APK
      run: |
        cd project/ELITE_EMPIRE_SAFE_PROJECT/ELITE_EMPIRE
        
        # Force Python 3.11
        export PATH="/opt/hostedtoolcache/Python/3.11.*/x64/bin:$PATH"
        export PYTHON="/opt/hostedtoolcache/Python/3.11.*/x64/bin/python3"
        
        # Network Timeout Handling
        export PIP_DEFAULT_TIMEOUT=100
        export GRADLE_OPTS="-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"
        
        # Force system autoconf
        export AUTOCONF=/usr/bin/autoconf
        export AUTOMAKE=/usr/bin/automake
        
        # Auto-accept licenses and build
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ELITE-EMPIRE-APK
        path: project/ELITE_EMPIRE_SAFE_PROJECT/ELITE_EMPIRE/bin/*.apk
